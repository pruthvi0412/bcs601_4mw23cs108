<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f4f4;
            padding:40px;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            width:500px;
            margin:auto;
        }

        h1{
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            margin-top:15px;
            padding:10px;
            width:100%;
            background:blue;
            color:white;
            border:none;
        }

        table{
            width:100%;
            margin-top:20px;
            border-collapse:collapse;
        }

        th, td{
            border:1px solid #ddd;
            padding:10px;
            text-align:center;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Expense Tracker</h1>

    <form method="POST">

        <input type="text" name="title" placeholder="Expense Title" required>

        <input type="number" step="0.01" name="amount" placeholder="Amount" required>

        <button type="submit">Add Expense</button>

    </form>

    <table>

        <tr>
            <th>Expense</th>
            <th>Amount</th>
        </tr>

        {% for item in expenses %}

        <tr>
            <td>{{ item.title }}</td>
            <td>₹ {{ item.amount }}</td>
        </tr>

        {% endfor %}

    </table>

    <h2>Total Expense: ₹ {{ total }}</h2>

</div>

</body>
</html>
